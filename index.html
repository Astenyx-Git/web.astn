<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.astn 文件查看器 — AstNovel</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Error Banner -->
  <div id="error-banner" class="error-banner hidden">
    <span id="error-text"></span>
    <button id="close-error" class="error-close">&times;</button>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <div id="loading-text" class="loading-text">正在读取文件...</div>
  </div>

  <!-- Landing Page -->
  <div id="landing" class="landing">
    <div class="landing-inner">
      <h1 class="landing-title" style="margin-top:8px;">ASTN Viewer</h1>
      <p class="landing-subtitle">AstNovel .astn 文件查看器</p>
      <p class="landing-desc">在浏览器中安全解码 .astn 文件，查看章节、角色、大纲、世界观等全部内容。所有数据仅在本地处理，不会上传至任何服务器。</p>

      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text">拖放 .astn 文件到此处</div>
        <div class="drop-zone-subtext">或点击选择文件</div>
      </div>
      <input type="file" id="file-input" accept=".astn" class="hidden">

      <div class="landing-footer">
        <p>AES-256-GCM 加密 · PBKDF2 密钥派生 · 完全离线运行</p>
      </div>
    </div>
  </div>

  <!-- Decoded View -->
  <div id="decoded" class="decoded hidden">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div id="book-cover" class="book-cover-thumb hidden"></div>
        <div class="book-info">
          <h1 id="book-title" class="book-title"></h1>
          <p id="book-description" class="book-description hidden"></p>
          <div id="asset-stats" class="asset-stats"></div>
        </div>
      </div>
      <div class="top-bar-right">
        <button id="dark-toggle" class="btn-icon" title="切换主题">🌙</button>
        <button id="load-another-btn" class="btn-icon" title="加载其他文件">📂</button>
      </div>
    </header>

    <!-- Mobile Tab Bar -->
    <div id="mobile-tabs" class="mobile-tabs">
      <button class="mobile-tab active" data-tab="sidebar">目录</button>
      <button class="mobile-tab" data-tab="content">内容</button>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div id="sidebar-list" class="sidebar-list"></div>
      </aside>

      <!-- Content Area -->
      <main id="main-content" class="main-content">
        <div class="main-placeholder">选择左侧资产查看内容</div>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
